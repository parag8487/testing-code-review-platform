---
# Multi-service development stack generated by ForgeOps.

name: Code_review_platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: Code_review_platform-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-Code_review_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  code-review:
    container_name: Code_review_platform-code-review
    build:
      context: .
      dockerfile: Dockerfile
    image: Code_review_platform-code-review:latest
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
    restart: unless-stopped
    depends_on:
      - postgres
    command: ["npm", "run", "start", "--workspace=code-review"]
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  live-classroom:
    container_name: Code_review_platform-live-classroom
    build:
      context: .
      dockerfile: Dockerfile
    image: Code_review_platform-live-classroom:latest
    ports:
      - "3001:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
    restart: unless-stopped
    depends_on:
      - postgres
    command: ["npm", "run", "start", "--workspace=live classroom"]
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
